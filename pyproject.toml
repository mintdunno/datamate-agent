[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "datamate-harness"
version = "0.1.0"
description = "Offline-first contracts and evaluation foundation for DataMate"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4,<3",
    "httpx>=0.28.1",
    "openpyxl>=3.1,<4",
    "polars>=1.30,<2",
    "psutil>=7.2,<9",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim[openai]>=2.65.0",
    "python-dotenv>=1.2.4",
    "pytz>=2026.6",
    "rank-bm25>=0.2.2,<1",
    "rapidfuzz>=3.14.6",
    "sqlglot>=30.29.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/datamate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
